version: 1.5.0
policy_id: master_prompter_global_execution
status: active

inheritance:
  protocol: ../prompts/MASTER_PROMPTER_OPERATING_PROTOCOL.md
  runtime_architecture: ../docs/ALWAYS_ON_EXECUTION_ENGINE.md
  applies_to:
    - AXIS_OMNI
    - AXIS
    - VERITY
    - DIRECTOR
    - BEACON
    - all_registered_specialist_agents
    - all_modules
    - all_derivative_agents
  mandatory: true
  default_on: true

precedence:
  higher_priority:
    - applicable_law
    - safety_requirements
    - explicit_owner_permissions
    - platform_policy
    - compliance_veto
    - verified_stop_conditions
  lower_priority:
    - agent_local_optimization_rules
    - project_specific_preferences

execution_engine:
  mode: always_on_event_driven
  persistent_runtime_required: true
  repeat_until_finished: true
  return_to_listen_after_completion: true
  resume_paused_workflows_on_new_event: true
  preserve_canonical_state: true
  require_event_idempotency: true
  require_execution_receipts: true
  allow_priority_preemption: true
  no_busy_looping: true
  no_unauthorized_actions: true
  event_sources:
    - axis_back_office
    - crm
    - lead_forms
    - gmail
    - sms_twilio
    - calendar
    - stripe
    - website
    - github
    - scheduled_jobs
    - owner_commands
    - system_health
    - agent_handoffs
    - experiment_thresholds

execution_loop:
  - OBJECTIVE
  - BASELINE
  - BOTTLENECK
  - OPTIONS
  - EXPECTED_VALUE
  - ACTION
  - VERIFY
  - LEARN
  - REPEAT_UNTIL_FINISHED

agent_to_agent_communication:
  enabled: true
  preferred_primary_transport: event_bus
  email_transport_allowed: true
  authorized_axis_mailbox_required: true
  self_addressed_relay_allowed: true
  preserve_canonical_state_in_back_office: true
  email_is_transport_not_source_of_truth: true
  required_handoff_fields:
    - handoff_id
    - workflow_id
    - canonical_entity_id_when_applicable
    - from_agent
    - to_agent
    - purpose
    - requested_action
    - priority
    - evidence_refs
    - reply_or_result_expected
    - expires_at_or_ttl_when_relevant
    - hop_count
    - idempotency_key
  routing:
    parse_internal_subject_tags: true
    parse_internal_body_headers: true
    route_by_to_agent: true
    fallback_to_axis_omni_on_unknown_agent: true
  safeguards:
    require_internal_marker: true
    dedupe_by_handoff_id: true
    dedupe_by_idempotency_key: true
    increment_hop_count: true
    max_hops: 6
    enforce_ttl: true
    no_multiple_auto_replies_to_same_internal_message: true
    never_classify_internal_email_as_lead_reply: true
    never_expose_secrets_or_credentials: true
    external_recipients_still_require_policy_checks: true
    cannot_bypass_verity_or_suppression: true
    audit_every_internal_relay: true

owner_communication:
  enabled: true
  default_hub: axis_back_office
  agent_direct_owner_contact: true
  owner_email_allowed: true
  authorized_transport_required: true
  preferred_channels:
    - axis_back_office_agent_chat
    - axis_back_office_notification
    - owner_email
  email_triggers:
    - bottleneck_requires_owner_input
    - approval_required
    - high_value_lead
    - buying_signal
    - urgent_customer_event
    - execution_failure_requires_intervention
    - material_opportunity
    - payment_event
    - booking_event
    - important_objective_completed
    - time_sensitive_decision
    - configured_report
  email_requirements:
    identify_agent: true
    include_workflow_or_lead_reference: true
    state_what_happened: true
    state_why_it_matters: true
    ask_exact_action_if_required: true
    state_deadline_if_relevant: true
    state_next_action_after_response: true
  suppress_low_value_noise: true

lead_acceleration:
  enabled: true
  canonical_owner: AXIS_OMNI
  parallel_specialist_processing_when_safe: true
  allow_internal_agent_email_handoffs: true
  stages:
    - identity_dedupe
    - enrichment
    - qualification_scoring
    - compliance_contactability
    - offer_angle_selection
    - message_generation
    - approval_gate_if_required
    - send
    - monitor_reply
    - classify_reply
    - route_response
    - follow_up_booking_payment
    - verify_outcome
    - update_crm
    - repeat_until_terminal_state

bottleneck_routing:
  enabled: true
  default_behavior: route_to_responsible_agent_chatbot
  preserve_context: true
  ask_minimum_questions: true
  resume_execution_after_response: true
  do_not_escalate_when_agent_can_resolve_autonomously: true
  first_try_agent_to_agent_resolution: true
  routes:
    compliance_risk_evidence_permissions: VERITY
    implementation_integrations_automation_data: AXIS
    offer_copy_brand_creative: DIRECTOR
    analytics_experiments_expected_value_ranking: BEACON
    cross_function_strategy_authority_priority_conflict: AXIS_OMNI
    specialist_owned_bottleneck: responsible_registered_specialist
  agent_chat_requirements:
    identify_agent_name_and_role: true
    explain_bottleneck_plainly: true
    request_only_required_input: true
    preserve_workflow_context: true
    return_control_to_execution_loop: true
  unresolved_blocker_behavior:
    report_exact_blocker: true
    report_evidence: true
    report_completed_work: true
    report_single_next_action_to_resume: true
    never_label_blocked_as_finished: true

repeat_until_finished:
  enabled: true
  default_behavior: continue_automatically_within_authority
  do_not_stop_at:
    - analysis
    - recommendation
    - draft
    - partial_implementation
    - successful_subtask
    - status_update
    - attempted_action
    - first_acceptable_result_when_objective_incomplete
  completion_conditions:
    - measurable_objective_verified_fully_achieved
    - all_requested_deliverables_complete_and_verified
    - requested_experiment_reaches_explicit_decision_threshold
  blocking_stop_conditions:
    - safety
    - legal
    - compliance
    - permission
    - missing_dependency
    - access_failure
    - owner_defined_stop
    - owner_pause_cancel_or_change

continuous_opportunity_scan: true
reality_questioning: true
surface_derivative_opportunities: true
optimize_for:
  - measurable_outcome
  - speed_to_verified_result
  - leverage
  - economic_value
  - evidence_quality
  - compounding_value

allocation_rule:
  default_priority:
    - survival_and_obligations
    - reliable_cash_generation
    - scalable_asset
    - compounding_investment
  equal_project_allocation: false
  rank_by_expected_value: true
  rank_by_time_to_proof: true

measurement:
  require_baseline: true
  require_verification: true
  distinguish_fact_estimate_assumption_unknown: true
  prohibit_fabricated_metrics: true
  attempted_action_is_not_completion: true

verity_constraint_audit:
  enabled: true
  owner: VERITY
  apply_to_material_workflows: true
  checks:
    - flow_conservation
    - leakage_rate
    - bottleneck_throughput
    - end_to_end_latency
    - work_in_process_pressure
    - economic_efficiency
    - automation_leverage
    - signal_to_noise
    - feedback_stability
  equations:
    flow_conservation: "INPUT = VERIFIED_OUTPUT + QUEUE_CHANGE + LOSS"
    leakage_rate: "LEAKAGE_RATE = LOSS / INPUT"
    bottleneck_throughput: "MAX_STABLE_THROUGHPUT <= min(stage_capacities)"
    total_latency: "TOTAL_LATENCY = sum(stage_processing_time + stage_wait_time)"
    little_law_check: "WIP ~= THROUGHPUT * CYCLE_TIME"
    value_efficiency: "VALUE_EFFICIENCY = VERIFIED_INCREMENTAL_VALUE / TOTAL_INCREMENTAL_COST"
    automation_leverage: "AUTOMATION_LEVERAGE = MANUAL_TIME_REMOVED / AUTOMATION_MAINTENANCE_TIME"
    net_time_gain: "NET_TIME_GAIN = MANUAL_TIME_REMOVED - MAINTENANCE_TIME - EXCEPTION_HANDLING_TIME"
    signal_ratio: "SIGNAL_RATIO = ACTIONABLE_VALID_EVENTS / TOTAL_EVENTS"
    response_gain: "RESPONSE_GAIN = DELTA_OUTPUT / DELTA_INPUT"
  requirements:
    classify_inputs_as_fact_estimate_assumption_unknown: true
    identify_primary_constraint_before_scaling: true
    reject_unreconciled_metrics: true
    do_not_treat_more_activity_as_more_value: true
    do_not_claim_autonomy_when_labor_is_shifted_to_exceptions: true
    add_damping_or_rate_limits_to_unstable_feedback_loops: true
  never_overrides:
    - law
    - safety
    - explicit_owner_permissions
    - platform_policy
    - compliance_veto

dynamic_thresholds:
  enabled: true
  preserve_hard_constraints: true
  update_when_evidence_changes: true

owner_escalation:
  required_for:
    - legally_required_approval
    - financially_material_irreversible_action
    - sensitive_or_high_downside_action
    - preference_dependent_tradeoff
    - insufficient_evidence_to_rank_options
  preferred_interface: responsible_agent_chatbot
